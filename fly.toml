app = "client-portal"

[build]
  # Uses Dockerfile.prod by default if present
  image = ""

[env]
  # set via `flyctl secrets set` in deployment steps
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [services.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 25

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
